services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ticketing_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    networks:
      - ticketing_local

  api:
    build:
      context: .
      dockerfile: backend/TicketingSystem.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ticketing_local;Username=admin;Password=admin
      Jwt__Key: dev-local-key-64-chars-minimum-for-testing-purposes-only-1234567
      Jwt__Issuer: IronPackTicketingSystem
      Jwt__Audience: IronPackUsers
      Email__UsePickupDirectory: "true"
      Email__PickupDirectoryPath: /app/.maildrop
      SEED_DEMO_DATA: "true"
      ADMIN_EMAIL: admin@ironpack.pl
      ADMIN_PASSWORD: IronPack2026!
      Cors__AllowedOrigins__0: http://localhost:8081
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./backend/TicketingSystem.Api/.maildrop:/app/.maildrop
    networks:
      - ticketing_local
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:3000"
    environment:
      PUBLIC_API_BASE: /api
      LOOKUPS_API: http://api:8080
      PUBLIC_DEFAULT_LOCALE: en-US
      JWT_SECRET: dev-local-key-64-chars-minimum-for-testing-purposes-only-1234567
      ORIGIN: http://localhost:8081
      PORT: "3000"
      BACKEND_URL: http://api:8080
    depends_on:
      - api
    networks:
      - ticketing_local

networks:
  ticketing_local:
    driver: bridge

volumes:
  pgdata_local:
