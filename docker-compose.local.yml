name: ticketing-system-local

x-api-build: &api-build
  context: .
  dockerfile: backend/TicketingSystem.Api/Dockerfile.dev

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8080
  ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ticketing_system;Username=admin;Password=admin
  Jwt__Key: dev-local-key-64-chars-minimum-for-testing-purposes-only-1234567
  Jwt__Issuer: IronPackTicketingSystem
  Jwt__Audience: IronPackUsers
  Cors__AllowedOrigins__0: http://localhost:3000
  Email__SmtpHost: localhost
  Email__SmtpPort: "25"
  Email__UseSsl: "false"
  Email__FromAddress: no-reply@localhost.test
  Email__FromName: Ticketing System Local
  Email__BaseUrl: http://localhost:3000
  Email__TemplatesPath: EmailTemplates
  Email__UsePickupDirectory: "true"
  Email__PickupDirectoryPath: /workspace/backend/TicketingSystem.Api/.maildrop
  SEED_DEMO_DATA: "true"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ticketing_system
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ticketing_system"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: *api-build
    command: ["dotnet", "run", "--no-launch-profile", "--", "--migrate-only"]
    environment:
      <<: *api-environment
      ADMIN_EMAIL: admin@localhost.test
      ADMIN_PASSWORD: LocalDevelopmentOnly2026!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/TicketingSystem.Api:/workspace/backend/TicketingSystem.Api
      - api-bin:/workspace/backend/TicketingSystem.Api/bin
      - api-obj:/workspace/backend/TicketingSystem.Api/obj
    restart: "no"

  api:
    build: *api-build
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "5000:8080"
    volumes:
      - ./backend/TicketingSystem.Api:/workspace/backend/TicketingSystem.Api
      - api-bin:/workspace/backend/TicketingSystem.Api/bin
      - api-obj:/workspace/backend/TicketingSystem.Api/obj
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      PUBLIC_API_BASE: /api
      PUBLIC_DEFAULT_LOCALE: en-US
      LOOKUPS_API: http://api:8080
      BACKEND_URL: http://api:8080
      JWT_SECRET: dev-local-key-64-chars-minimum-for-testing-purposes-only-1234567
      ORIGIN: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-svelte-kit:/app/.svelte-kit
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  api-bin:
  api-obj:
  frontend-node-modules:
  frontend-svelte-kit:
