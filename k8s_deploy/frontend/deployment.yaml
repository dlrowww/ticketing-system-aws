apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-system-frontend
  namespace: ticketing-system
  labels:
    app.kubernetes.io/name: ticketing-system-frontend
    app.kubernetes.io/part-of: ticketing-system
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticketing-system-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticketing-system-frontend
        app.kubernetes.io/part-of: ticketing-system
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          # 替换为 Terraform 输出的 frontend ECR URL 和不可变 tag。
          image: ticketing-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: ticketing-system-frontend
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ticketing-system-runtime
                  key: jwt-key
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

