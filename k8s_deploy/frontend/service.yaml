apiVersion: v1
kind: Service
metadata:
  name: ticketing-system-frontend
  namespace: ticketing-system
  labels:
    app.kubernetes.io/part-of: ticketing-system
    app.kubernetes.io/component: frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ticketing-system-frontend
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

