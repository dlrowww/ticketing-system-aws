# External Secrets Operator and its IRSA ServiceAccount are installed by
# Terraform. Replace the four example remote keys before applying this file.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ticketing-system-aws-secrets-manager
  namespace: ticketing-system
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ticketing-system-runtime
  namespace: ticketing-system
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: ticketing-system-aws-secrets-manager
    kind: SecretStore
  target:
    name: ticketing-system-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        connection-string: 'Host={{ .dbHost }};Port={{ .dbPort }};Database=ticketing_system;Username={{ .dbUsername }};Password="{{ .dbPassword }}";SSL Mode=Require'
        jwt-key: '{{ .jwtKey }}'
        smtp-username: '{{ .smtpUsername }}'
        smtp-password: '{{ .smtpPassword }}'
        admin-email: '{{ .adminEmail }}'
        admin-password: '{{ .adminPassword }}'
  data:
    - secretKey: dbHost
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_RDS_MASTER_SECRET_ARN
        property: host
    - secretKey: dbPort
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_RDS_MASTER_SECRET_ARN
        property: port
    - secretKey: dbUsername
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_RDS_MASTER_SECRET_ARN
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_RDS_MASTER_SECRET_ARN
        property: password
    - secretKey: jwtKey
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_JWT_SECRET_NAME
        property: key
    - secretKey: smtpUsername
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_SMTP_SECRET_NAME
        property: username
    - secretKey: smtpPassword
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_SMTP_SECRET_NAME
        property: password
    - secretKey: adminEmail
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_INITIAL_ADMIN_SECRET_NAME
        property: email
    - secretKey: adminPassword
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_INITIAL_ADMIN_SECRET_NAME
        property: password
