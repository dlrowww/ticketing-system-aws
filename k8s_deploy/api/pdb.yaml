# The API Deployment starts with two replicas, so one Pod can remain available.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketing-system-api
  namespace: ticketing-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticketing-system-api
      app.kubernetes.io/component: api
