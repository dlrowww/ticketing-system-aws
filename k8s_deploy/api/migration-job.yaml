apiVersion: batch/v1
kind: Job
metadata:
  name: ticketing-system-api-migration
  namespace: ticketing-system
  labels:
    app.kubernetes.io/name: ticketing-system-api-migration
    app.kubernetes.io/part-of: ticketing-system
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticketing-system-api-migration
        app.kubernetes.io/part-of: ticketing-system
        app.kubernetes.io/component: database-migration
    spec:
      serviceAccountName: ticketing-api
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          # Keep this image exactly aligned with api/deployment.yaml.
          image: ticketing-backend:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --migrate-only
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: ticketing-system-api
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: ticketing-system-runtime
                  key: connection-string
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: ticketing-system-runtime
                  key: jwt-key
            - name: Email__Username
              valueFrom:
                secretKeyRef:
                  name: ticketing-system-runtime
                  key: smtp-username
                  optional: true
            - name: Email__Password
              valueFrom:
                secretKeyRef:
                  name: ticketing-system-runtime
                  key: smtp-password
                  optional: true
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ticketing-system-runtime
                  key: admin-email
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketing-system-runtime
                  key: admin-password
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
