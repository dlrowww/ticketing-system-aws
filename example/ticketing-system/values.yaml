global:
  environment: Production
  domain: tickets.example.com

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace:
  # Helm normally receives the namespace through --namespace/--create-namespace.
  # Enable this only when this release should explicitly manage the Namespace.
  create: false
  labels: {}
  annotations: {}

# External Secrets Operator is installed by Terraform. When enabled, these
# settings create a namespaced SecretStore and synchronize AWS Secrets Manager
# values into api.existingSecret. Supply remoteRefs with terraform outputs.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStore:
    name: ""
    region: us-east-1
  remoteRefs:
    rdsMaster: ""
    jwt: ""
    smtp: ""
    initialAdmin: ""
  properties:
    rds:
      host: host
      port: port
      username: username
      password: password
    jwt:
      key: key
    smtp:
      username: username
      password: password
    initialAdmin:
      email: email
      password: password
  database:
    name: ticketing_system
    extraParameters: SSL Mode=Require

frontend:
  replicaCount: 1
  image:
    repository: ticketing-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  config:
    publicApiBase: /api
    publicDefaultLocale: en-US
    origin: https://tickets.example.com
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    startup:
      enabled: true
      path: /
      failureThreshold: 30
      periodSeconds: 5
    readiness:
      enabled: true
      path: /
      periodSeconds: 10
    liveness:
      enabled: true
      path: /
      periodSeconds: 20
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

api:
  # Keep this at 1 while Program.cs performs EF migrations in every API process.
  # Move migrations to a dedicated one-shot command/Job before scaling the API.
  replicaCount: 1
  image:
    repository: ticketing-backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    # The frontend ConfigMap builds its runtime BACKEND_URL from this name.
    name: api
    type: ClusterIP
    port: 8080
    targetPort: 8080
  serviceAccount:
    create: true
    name: ticketing-api
    # The API no longer reads AWS directly; ESO owns the IRSA role.
    automount: false
    annotations: {}
  config:
    aspnetcoreEnvironment: Production
    jwtIssuer: TicketingSystem
    jwtAudience: TicketingSystemFrontend
    corsAllowedOrigin: https://tickets.example.com
    smtpHost: smtp.gmail.com
    smtpPort: "587"
    smtpUseSsl: "true"
    emailFromAddress: noreply@example.com
    emailFromName: Ticketing System
    emailBaseUrl: https://tickets.example.com
    seedDemoData: "false"
    backupEnabled: "false"
  existingSecret: ticketing-system-runtime
  secretKeys:
    connectionString: connection-string
    jwtKey: jwt-key
    smtpUsername: smtp-username
    smtpPassword: smtp-password
    adminEmail: admin-email
    adminPassword: admin-password
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    # /health currently includes the PostgreSQL readiness check.
    startup:
      enabled: true
      path: /health
      failureThreshold: 60
      periodSeconds: 5
    readiness:
      enabled: true
      path: /health
      periodSeconds: 10
    liveness:
      enabled: true
      path: /health
      periodSeconds: 30
      failureThreshold: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  # After ACM is available, set certificateArn and enable HTTPS redirect.
  certificateArn: ""
  sslRedirect: true
  paths:
    api: /api
    frontend: /

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
