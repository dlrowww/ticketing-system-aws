apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticketing-system.apiServiceName" . }}
  labels:
    {{- include "ticketing-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.api.probes.readiness.path | quote }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "ticketing-system.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
