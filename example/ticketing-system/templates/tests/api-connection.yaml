apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ticketing-system.fullname" . }}-api-test
  labels:
    {{- include "ticketing-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: api
      image: busybox:1.36
      command: ["wget"]
      args:
        - "-qO-"
        - "http://{{ include "ticketing-system.apiServiceName" . }}:{{ .Values.api.service.port }}/health"

