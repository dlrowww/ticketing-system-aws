{{- if .Values.externalSecrets.enabled }}
{{- $rdsSecret := required "externalSecrets.remoteRefs.rdsMaster is required when External Secrets is enabled" .Values.externalSecrets.remoteRefs.rdsMaster }}
{{- $jwtSecret := required "externalSecrets.remoteRefs.jwt is required when External Secrets is enabled" .Values.externalSecrets.remoteRefs.jwt }}
{{- $smtpSecret := required "externalSecrets.remoteRefs.smtp is required when External Secrets is enabled" .Values.externalSecrets.remoteRefs.smtp }}
{{- $adminSecret := required "externalSecrets.remoteRefs.initialAdmin is required when External Secrets is enabled" .Values.externalSecrets.remoteRefs.initialAdmin }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "ticketing-system.externalSecretStoreName" . }}
  labels:
    {{- include "ticketing-system.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.secretStore.region | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ticketing-system.fullname" . }}-runtime
  labels:
    {{- include "ticketing-system.labels" . | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "ticketing-system.externalSecretStoreName" . }}
    kind: SecretStore
  target:
    name: {{ required "api.existingSecret is required" .Values.api.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        connection-string: {{ printf "Host={{ .dbHost }};Port={{ .dbPort }};Database=%s;Username={{ .dbUsername }};Password=\"{{ .dbPassword }}\";%s" .Values.externalSecrets.database.name .Values.externalSecrets.database.extraParameters | quote }}
        jwt-key: {{ "{{ .jwtKey }}" | quote }}
        smtp-username: {{ "{{ .smtpUsername }}" | quote }}
        smtp-password: {{ "{{ .smtpPassword }}" | quote }}
        admin-email: {{ "{{ .adminEmail }}" | quote }}
        admin-password: {{ "{{ .adminPassword }}" | quote }}
  data:
    - secretKey: dbHost
      remoteRef:
        key: {{ $rdsSecret | quote }}
        property: {{ .Values.externalSecrets.properties.rds.host | quote }}
    - secretKey: dbPort
      remoteRef:
        key: {{ $rdsSecret | quote }}
        property: {{ .Values.externalSecrets.properties.rds.port | quote }}
    - secretKey: dbUsername
      remoteRef:
        key: {{ $rdsSecret | quote }}
        property: {{ .Values.externalSecrets.properties.rds.username | quote }}
    - secretKey: dbPassword
      remoteRef:
        key: {{ $rdsSecret | quote }}
        property: {{ .Values.externalSecrets.properties.rds.password | quote }}
    - secretKey: jwtKey
      remoteRef:
        key: {{ $jwtSecret | quote }}
        property: {{ .Values.externalSecrets.properties.jwt.key | quote }}
    - secretKey: smtpUsername
      remoteRef:
        key: {{ $smtpSecret | quote }}
        property: {{ .Values.externalSecrets.properties.smtp.username | quote }}
    - secretKey: smtpPassword
      remoteRef:
        key: {{ $smtpSecret | quote }}
        property: {{ .Values.externalSecrets.properties.smtp.password | quote }}
    - secretKey: adminEmail
      remoteRef:
        key: {{ $adminSecret | quote }}
        property: {{ .Values.externalSecrets.properties.initialAdmin.email | quote }}
    - secretKey: adminPassword
      remoteRef:
        key: {{ $adminSecret | quote }}
        property: {{ .Values.externalSecrets.properties.initialAdmin.password | quote }}
{{- end }}
