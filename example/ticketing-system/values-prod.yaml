externalSecrets:
  enabled: true

frontend:
  replicaCount: 2
  pdb:
    enabled: true

api:
  # Intentionally remains 1 until startup EF migrations are extracted.
  replicaCount: 1
  pdb:
    enabled: false

ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
