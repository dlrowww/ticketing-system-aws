name: Development Environment Teardown

on:
  workflow_dispatch:
    inputs:
      action:
        description: Generate a destroy plan or destroy the complete dev environment
        required: true
        default: plan
        type: choice
        options:
          - plan
          - destroy
      acknowledge_data_loss:
        description: I understand that destroy permanently removes the dev database, images, and application Secrets
        required: true
        default: false
        type: boolean
      confirmation:
        description: For destroy, type destroy-ticketing-system-dev
        required: false
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.15.8"

jobs:
  teardown:
    name: Terraform ${{ inputs.action }} dev environment
    runs-on: ubuntu-latest
    environment: dev-infrastructure
    concurrency:
      group: ticketing-system-dev-infrastructure
      cancel-in-progress: false
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate teardown request
        env:
          ACTION: ${{ inputs.action }}
          ACKNOWLEDGE_DATA_LOSS: ${{ inputs.acknowledge_data_loss }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CONFIGURED_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'dev' }}
        run: |
          if [[ "$CONFIGURED_ENVIRONMENT" != "dev" ]]; then
            echo "This workflow is restricted to the dev environment; configured value is '$CONFIGURED_ENVIRONMENT'" >&2
            exit 1
          fi

          if [[ "$ACTION" == "destroy" ]]; then
            if [[ "$ACKNOWLEDGE_DATA_LOSS" != "true" ]]; then
              echo "Destroy requires the data-loss acknowledgement" >&2
              exit 1
            fi
            if [[ "$CONFIRMATION" != "destroy-ticketing-system-dev" ]]; then
              echo "Destroy confirmation did not match destroy-ticketing-system-dev" >&2
              exit 1
            fi
          fi

      - name: Verify infrastructure role configuration
        env:
          ROLE_ARN: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
        run: |
          if [[ -z "$ROLE_ARN" ]]; then
            echo "AWS_INFRASTRUCTURE_ROLE_ARN is not configured in the dev-infrastructure environment" >&2
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform -chdir=aws init -input=false

      - name: Create destroy plan
        run: terraform -chdir=aws plan -destroy -out=teardown.tfplan -input=false -lock-timeout=5m

      - name: Show destroy plan
        run: terraform -chdir=aws show -no-color teardown.tfplan

      - name: Read EKS cluster name
        if: inputs.action == 'destroy'
        id: cluster
        run: |
          cluster_name="$(terraform -chdir=aws output -raw cluster_id 2>/dev/null || true)"
          if [[ -z "$cluster_name" ]]; then
            echo "EKS cluster output is absent; skipping Kubernetes cleanup"
            echo "exists=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$cluster_name" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "Unsafe EKS cluster output" >&2
            exit 1
          }

          if ! lookup_result="$(aws eks describe-cluster --name "$cluster_name" --query 'cluster.status' --output text 2>&1)"; then
            if [[ "$lookup_result" == *"ResourceNotFoundException"* ]]; then
              echo "EKS cluster '$cluster_name' no longer exists; skipping Kubernetes cleanup"
              echo "exists=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Failed to check EKS cluster '$cluster_name': $lookup_result" >&2
            exit 1
          fi

          {
            echo "name=${cluster_name}"
            echo "exists=true"
          } >>"$GITHUB_OUTPUT"

      - name: Set up kubectl
        if: inputs.action == 'destroy' && steps.cluster.outputs.exists == 'true'
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure the EKS kubeconfig
        if: inputs.action == 'destroy' && steps.cluster.outputs.exists == 'true'
        run: aws eks update-kubeconfig --name "${{ steps.cluster.outputs.name }}" --region "${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Delete Kubernetes application and wait for ALB cleanup
        if: inputs.action == 'destroy' && steps.cluster.outputs.exists == 'true'
        run: |
          if ! kubectl get namespace ticketing-system >/dev/null 2>&1; then
            echo "ticketing-system namespace does not exist; continuing with Terraform destroy"
            exit 0
          fi

          kubectl delete ingress \
            --all \
            --namespace ticketing-system \
            --ignore-not-found \
            --wait=true \
            --timeout=10m

          kubectl delete namespace ticketing-system \
            --wait=true \
            --timeout=10m

      - name: Apply destroy plan
        if: inputs.action == 'destroy'
        run: terraform -chdir=aws apply -input=false -lock-timeout=5m teardown.tfplan

      - name: Write teardown summary
        if: always()
        env:
          ACTION: ${{ inputs.action }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Development environment teardown"
            echo ""
            echo "- Requested action: \`$ACTION\`"
            echo "- Result: \`$JOB_STATUS\`"
            if [[ "$ACTION" == "plan" ]]; then
              echo "- No resources were deleted; review the destroy plan in this run."
            else
              echo "- The Terraform backend, GitHub OIDC provider, and bootstrap IAM roles are outside this state and were not deleted."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
